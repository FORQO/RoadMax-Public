  function end(e){pointers.delete(e.pointerId);prev=frame();}

  viewport.addEventListener('wheel',e=>{e.preventDefault();const p=local(e);scale(p.x,p.y,zoom*Math.exp(-Math.max(-500,Math.min(500,e.deltaY*(e.deltaMode===1?16:1)))*.002));},{passive:false});
  function step(r){scale(viewport.clientWidth/2,viewport.clientHeight/2,zoom*r);}
  select('minus').onclick=()=>step(1/1.25);select('plus').onclick=()=>step(1.25);select('fit').onclick=fit;
  viewport.addEventListener('keydown',e=>{if(e.target.closest('button,a'))return;const moves={ArrowLeft:[60,0],ArrowRight:[-60,0],ArrowUp:[0,60],ArrowDown:[0,-60]};if(moves[e.key]){e.preventDefault();const [x,y]=moves[e.key];dx+=x;dy+=y;fitted=false;show();}else if(['+','=','-','0','Home'].includes(e.key)){e.preventDefault();if(e.key==='0'||e.key==='Home')fit();else step(e.key==='-'?.8:1.25);}});
  new ResizeObserver(()=>{if(fitted)fit()}).observe(viewport);
  fit();
})();
</script></body></html>
